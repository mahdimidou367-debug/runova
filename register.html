<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | RUNOVA</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-page">

    <div class="auth-container">

        <a href="index.html" class="auth-logo">
            RUN<span>OVA</span>
        </a>


        <div class="auth-card">

            <p class="eyebrow">
                START YOUR JOURNEY
            </p>

            <h1>
                Create your account
            </h1>

            <p class="auth-description">
                Tell us a little about yourself.
            </p>


            <form id="registerForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >


                <label>
                    Weight (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    placeholder="72"
                    required
                >


                <label>
                    Height (cm)
                </label>

                <input
                    type="number"
                    id="height"
                    placeholder="178"
                    required
                >


                <label>
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="22"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn auth-submit">

                    Create Account

                </button>

            </form>


            <p class="auth-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
